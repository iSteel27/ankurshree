<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1B382B" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0B1A14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050C09" stop-opacity="1"/>
    </radialGradient>

    <!-- Golden Aura Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Ring Gradient -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="35%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>

    <!-- Sprout Green Gradient -->
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="40%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>

    <!-- Right Leaf Gradient -->
    <linearGradient id="rightLeafGrad" x1="0%" y1="100%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>

    <!-- Protective Hands / Lotus Gradient (Shree motif) -->
    <linearGradient id="shreeHands" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="600" rx="40" fill="url(#bgGlow)"/>
  
  <!-- Outer Decorative Border -->
  <rect x="15" y="15" width="570" height="570" rx="32" fill="none" stroke="url(#goldRing)" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="25" y="25" width="550" height="550" rx="26" fill="none" stroke="url(#goldRing)" stroke-width="1" stroke-dasharray="6,6" stroke-opacity="0.25"/>

  <!-- Sun Glow in center -->
  <circle cx="300" cy="240" r="170" fill="url(#sunGlow)"/>

  <!-- Golden Radiance Rays behind sprout -->
  <g stroke="url(#goldRing)" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round">
    <line x1="300" y1="120" x2="300" y2="85" />
    <line x1="375" y1="150" x2="400" y2="125" />
    <line x1="420" y1="215" x2="450" y2="205" />
    <line x1="225" y1="150" x2="200" y2="125" />
    <line x1="180" y1="215" x2="150" y2="205" />
  </g>

  <!-- Protective Lotus Cradle (Shree/Lakshmi motif - Supporting Hands) -->
  <g id="lotus-cradle">
    <!-- Left Supporting Petal / Hand -->
    <path d="M 300,340 C 230,340 185,300 170,240 C 180,275 220,320 285,325 Z" 
          fill="url(#shreeHands)" opacity="0.85"/>
    <path d="M 300,345 C 240,345 200,315 185,260 C 200,295 240,335 300,345 Z" 
          fill="url(#goldRing)" opacity="0.6"/>

    <!-- Right Supporting Petal / Hand -->
    <path d="M 300,340 C 370,340 415,300 430,240 C 420,275 380,320 315,325 Z" 
          fill="url(#shreeHands)" opacity="0.85"/>
    <path d="M 300,345 C 360,345 400,315 415,260 C 400,295 360,335 300,345 Z" 
          fill="url(#goldRing)" opacity="0.6"/>

    <!-- Central Base Lotus Jewel -->
    <circle cx="300" cy="340" r="14" fill="url(#goldRing)" filter="url(#glow)"/>
    <circle cx="300" cy="340" r="7" fill="#FFF"/>
  </g>

  <!-- The Sprout (Ankur - अंकुर) Rising with Life -->
  <g id="rising-sprout">
    <!-- Central Stem -->
    <path d="M 300,335 Q 298,245 300,165" 
          fill="none" stroke="url(#sproutGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Left Heart-Shaped Leaf -->
    <path d="M 298,235 C 245,225 210,180 230,135 C 265,130 292,175 298,235 Z" 
          fill="url(#sproutGrad)" filter="url(#glow)"/>
    <!-- Leaf Inner Vein -->
    <path d="M 295,225 Q 260,185 240,150" 
          fill="none" stroke="#BBF7D0" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Right Ascending Leaf -->
    <path d="M 300,205 C 345,190 380,145 365,105 C 330,105 305,150 300,205 Z" 
          fill="url(#rightLeafGrad)" filter="url(#glow)"/>
    <!-- Leaf Inner Vein -->
    <path d="M 302,195 Q 335,155 352,120" 
          fill="none" stroke="#DCFCE7" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Top Budding Seedling Shoot -->
    <path d="M 300,165 C 292,145 294,125 300,110 C 306,125 308,145 300,165 Z" 
          fill="#86EFAC"/>
  </g>

  <!-- Auspicious Bindi / Sun Drop at Peak -->
  <circle cx="300" cy="95" r="7" fill="url(#goldRing)" filter="url(#glow)"/>

  <!-- Typography -->
  <!-- Devanagari Main Name -->
  <text x="300" y="420" 
        font-family="'Noto Sans Devanagari', 'Segoe UI', 'Arial', sans-serif" 
        font-size="46" 
        font-weight="800" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        letter-spacing="2">
    अंकुर श्री
  </text>

  <!-- English Sub-Brand -->
  <text x="300" y="460" 
        font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" 
        font-size="24" 
        font-weight="700" 
        text-anchor="middle" 
        fill="url(#goldRing)" 
        letter-spacing="8">
    ANKURSHREE
  </text>

  <!-- Golden Divider -->
  <line x1="180" y1="485" x2="420" y2="485" stroke="url(#goldRing)" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="300" cy="485" r="4" fill="#EAB308"/>

  <!-- Tagline: सीख • कमा • सिखा -->
  <text x="300" y="525" 
        font-family="'Noto Sans Devanagari', 'Segoe UI', sans-serif" 
        font-size="20" 
        font-weight="600" 
        text-anchor="middle" 
        fill="#86EFAC" 
        letter-spacing="3">
    सीख  •  कमा  •  सिखा
  </text>
  <text x="300" y="552" 
        font-family="'Inter', 'Segoe UI', sans-serif" 
        font-size="14" 
        font-weight="400" 
        text-anchor="middle" 
        fill="#94A3B8" 
        letter-spacing="4">
    LEARN  •  EARN  •  TEACH
  </text>
</svg>
